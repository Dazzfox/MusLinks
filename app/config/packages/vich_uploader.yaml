vich_uploader:
    db_driver: orm
    mappings:
        professional_images:
            uri_prefix: /uploads/professionals
            upload_destination: '%kernel.project_dir%/public/uploads/professionals'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: true
            delete_on_update: true
            delete_on_remove: true
