<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo MusLinks">
  <title>MusLinks</title>
  <defs>
    <!-- Gradient gemstone : lumière en haut-gauche comme une pierre taillée -->
    <radialGradient id="ml-gem" cx="28%" cy="22%" r="78%">
      <stop offset="0%"   stop-color="#6ee7b7"/>  <!-- éclat clair -->
      <stop offset="38%"  stop-color="#059669"/>  <!-- émeraude vif -->
      <stop offset="100%" stop-color="#022c22"/>  <!-- ombre profonde -->
    </radialGradient>
    <!-- Ombre portée -->
    <filter id="ml-shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Losange plein avec ombre et dégradé -->
  <polygon
    points="100,6 194,100 100,194 6,100"
    fill="url(#ml-gem)"
    filter="url(#ml-shadow)"/>

  <!-- Reflet facette haut-gauche (effet pierre polie) -->
  <polyline
    points="6,100 100,6 194,100"
    fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Filet or extérieur -->
  <polygon
    points="100,6 194,100 100,194 6,100"
    fill="none" stroke="#D97706" stroke-width="2.8"/>

  <!-- Filet or intérieur (retrait ~13 px perp. → r≈75) -->
  <polygon
    points="100,25 175,100 100,175 25,100"
    fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Ornement : petite étoile à 4 branches en or -->
  <polygon
    points="100,51 101.8,57 108,58.5 101.8,60 100,66 98.2,60 92,58.5 98.2,57"
    fill="#F59E0B"/>

  <!-- Filet horizontal fin séparant l'ornement des lettres -->
  <line x1="74" y1="75" x2="126" y2="75" stroke="#D97706" stroke-width="0.9" opacity="0.65"/>

  <!-- Monogramme ML — large, blanc, centré dans la zone basse du losange -->
  <text
    x="100" y="112"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia,'Times New Roman',serif"
    font-size="60"
    font-weight="bold"
    fill="white"
    letter-spacing="-2">ML</text>
</svg>
